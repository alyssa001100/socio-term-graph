# ============================================================
# 规范即配置：改标注规范只需要改这个文件
# validate.py 按这里定义的枚举和必填规则校验数据
# ============================================================
version: v13
updated: 2026-10-17

# 概念群 —— 每个群围绕一个核心问题，群内关系密集，群间只允许少量桥接
clusters:
  社会不平等: 社会不平等是如何被生产、维持与再生产的？
  社会秩序与越轨: 社会秩序如何可能？越轨又是如何被定义与控制的？
  社会行动与理性化: 现代社会的行动是如何被理性化地组织起来的？
  城市、空间与社区: 城市空间如何被社会关系塑造，又如何反过来塑造社会关系？
  性别、家庭与照护: 性别与家庭安排如何被组织起来，又如何生产与延续不平等？
  知识、文化与意义: 意义、分类与知识如何组织行动，又如何参与权力的运作？

# 封闭枚举 —— 自由填写会让标签体系立刻烂掉，这是数据运营的核心教训
enums:
  cluster:                     # 所属概念群（v5 新增）
    - 社会不平等
    - 社会秩序与越轨
    - 社会行动与理性化
    - 城市、空间与社区
    - 性别、家庭与照护
    - 知识、文化与意义
  school:                      # 所属流派
    - 古典社会学
    - 结构功能主义
    - 符号互动论
    - 冲突论
    - 交换论
    - 现象学与常人方法学
    - 女性主义社会学
    - 后结构主义与后现代
    - 文化社会学
    - 经济社会学
    - 历史社会学
    - 芝加哥学派                 # v7 新增
    - 新马克思主义               # v7 新增
    - 文化研究                   # v7 新增
    - 现代性研究                 # v7 新增
  application:                 # 应用场景
    - 社会分层与流动
    - 组织与科层制
    - 家庭与亲密关系
    - 城市与空间
    - 性别
    - 教育
    - 健康与医疗
    - 劳动与职业
    - 网络与数字社会
    - 移民与族群
    - 文化与消费
    - 越轨与犯罪
  status:                      # 条目状态
    - 草稿
    - 已复核
    - 有争议
  confidence:                  # 确信度
    - 明确实例
    - 部分符合
    - 有争议
  entry_type:                  # 条目类型（v3 新增）
    - 概念                     # 可被具体现象例证
    - 分析范畴                 # 划分或组织现象的维度，不要求有案例
  tier:                        # 谱系层级
    - core                     # 主脉
    - extended                 # 扩展传统
  relation_type:               # 概念关系类型
    - 继承
    - 批判
    - 借用
    - 等同
    - 对立
    - 包含
    - 转化                     # v2 新增：同一理论体系内可相互兑换的形式
    - 机制                     # v2 新增：前者是后者得以实现的作用机制
# 必填字段 —— 空值或缺失都会被校验拦下
required:
  terms:      [term_id, cluster, name_zh, name_en, proponent, first_year, first_source,
               school, application, definition, definition_source, entry_type, status, confidence]
  relations:  [rel_id, from_term, to_term, type, evidence, explain, source, status]
  cases:      [case_id, title, description, origin, source, attributions, status]
  hotspots:   [hot_id, title, description, date, review_after,
               analysis, attributions, status]
  # v13：学科史大谱系（宏观）。stage 决定界面归组，branch 决定阶段内分支。
  periods:    [period_id, name, span, question, note]
  lineages:   [lineage_id, name, from, to, periods, schools, question, thesis, blind_spot]
  placements: [term_id, lineage_id, problem, status]
  # v8 起 source_url 改为选填：出处登记到「作者 + 书目」为止，页码与链接都不再要求。
  # 手上有可核验链接时写进 fields 白名单里的 source_url 即可，没写不算缺项。
  # 归属块是防牵强的核心：相符与不符都必须写，只写「像」就是牵强
  attribution_required: [term_id, match, mismatch, confidence]

# 字段白名单 —— 每张表允许出现的字段全集
# 用途：拦截拼写错误、多余列、以及 YAML 行内映射里被逗号/换行意外截断的值
fields:
  terms:     [term_id, cluster, name_zh, name_en, aliases, proponent, first_year, first_source,
              school, application, definition, definition_source, polysemy,
              entry_type, status, confidence, reviewer, last_reviewed]
  polysemy:  [author, school, definition, differs_from, note, source]
  relations: [rel_id, from_term, to_term, type, evidence, explain, boundary, source, status]
  cases:     [case_id, title, description, origin, source, attributions, status]
  hotspots:  [hot_id, title, description, date, source_url, review_after,
              analysis, attributions, status]
  attribution: [term_id, match, mismatch, confidence, dissent]
  period:    [period_id, name, span, question, note]
  lineage:   [lineage_id, name, from, to, ongoing, periods, stage, branch, tier, figures,
              schools, question, thesis, blind_spot]
  placement: [term_id, lineage_id, problem, status]

# 数量约束
constraints:
  attribution_min: 1           # 每条案例/热点至少挂 1 个术语
  hotspot_review_months: 12    # 热点默认复审周期（月）
  relations_per_term_max: 12   # 单个术语关系数上限，防止过度连接
  # 长度下限：挡住「两者有关」这类写了等于没写的值
  explain_min_chars: 20        # 关系的 explain（这条边具体在说什么）
  boundary_min_chars: 10       # 关系的 boundary（这条边不意味着什么，选填但填了就要够长）
  match_min_chars: 20          # 归属块的 match（相符之处）
  analysis_min_chars: 60       # 热点的 analysis（逐层解析）
  bridge_per_cluster_pair_max: 5   # 每对概念群之间的桥接关系上限，防止跨群滥连
  # 谱系（v9）：版本与谱系边同样是「写了等于没写」的重灾区
  # 大谱系（v12）：时期说明、谱系问题与归属问题都不能写成空话
  period_note_min_chars: 20      # 时期 note（这一时期的背景与争论）
  lineage_question_min_chars: 8  # 谱系 question（这一脉问什么）
  lineage_thesis_min_chars: 20   # 谱系 thesis（一句话主张）
  lineage_blind_min_chars: 15    # 谱系 blind_spot（这一脉看不见什么）
  problem_min_chars: 15          # 归属 problem（它在该谱系中解释的社会学问题）
