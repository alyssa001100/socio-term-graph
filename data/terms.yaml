  name_en: exploitation
  aliases: [榨取]
  proponent: 卡尔·马克思
  first_year: 1867
  first_source: 资本论 第一卷
  school: [古典社会学, 冲突论]
  application: [劳动与职业]
  definition: 占有者凭借对生产资料的支配，无偿占有直接生产者所创造的剩余劳动的关系。
  definition_source: 马克思《资本论》第一卷 1867【页码待核】
  polysemy:
    - author: 约翰·罗默
      definition: 剥削不必以劳动价值论为前提；只要财产关系使一方以不平等的交换条件占有他方的劳动成果，即构成剥削。
      differs_from: 马克思
      note: 罗默把剥削从剩余价值的生产过程转移到财产关系与交换条件上，使其可脱离劳动价值论使用
      source: Roemer 1982, A General Theory of Exploitation and Class【页码待核】
