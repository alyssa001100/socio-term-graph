- term_id: TERM-0008
  name_zh: 阶级
  name_en: class
  aliases: [阶级]
  proponent: 卡尔·马克思
  first_year: 1848
  first_source: 共产党宣言
  school: [古典社会学, 冲突论]
  application: [社会分层与流动, 劳动与职业]
  definition: 依据对生产资料的占有关系划分的社会集团，其成员在生产关系中处于相同位置。
  definition_source: 马克思《共产党宣言》1848【页码待核】
  polysemy:
    - author: 马克斯·韦伯
      school: [古典社会学]
      definition: 在市场上具有相同生活机会的人群；与地位群体、政党并列，构成三种分层维度之一。
      differs_from: 马克思
      note: 马克思以生产关系为唯一划分标准，韦伯引入市场机会并改为多重维度
      source: 韦伯《经济与社会》1922【页码待核】
    - author: 皮埃尔·布迪厄
      school: [文化社会学]
      definition: 由资本总量与资本构成界定的群体位置，并通过生活方式与趣味表现自身。
      differs_from: 韦伯
      note: 把文化维度纳入阶级界定，阶级同时是分类实践的结果
      source: 布迪厄《区分》1984【页码待核】
