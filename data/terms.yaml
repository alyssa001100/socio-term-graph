- term_id: TERM-0001
  name_zh: 社会资本
  name_en: social capital
  aliases: [社会资本]
  proponent: 皮埃尔·布迪厄
  first_year: 1986
  first_source: The Forms of Capital
  school: [文化社会学, 经济社会学]
  application: [社会分层与流动, 劳动与职业]
  definition: 实际或潜在资源的总和，这些资源与由相互熟识的关系构成的、或多或少制度化的持久网络相联系。
  definition_source: 布迪厄《资本的形式》1986【页码待核】
  polysemy:
    - author: 詹姆斯·科尔曼
      school: [经济社会学]
      definition: 社会结构资源，表现为义务与期望、信息渠道、规范与有效惩罚。
      differs_from: 布迪厄
      note: 布迪厄强调资本的不平等再生产，科尔曼强调其作为理性行动的便利条件
      source: Coleman 1988, Social Capital in the Creation of Human Capital【页码待核】
    - author: 罗伯特·帕特南
      school: [文化社会学]
      definition: 信任、规范与网络等社会组织的特征，能促进合作以提高社会效率。
      differs_from: 科尔曼
      note: 分析单位从个体资源转向共同体层面
      source: Putnam 1993, Making Democracy Work【页码待核】
    - author: 林南
      school: [经济社会学]
      definition: 嵌入社会网络中、可通过目的性行动获取或动员的资源。
      differs_from: 布迪厄
      note: 转向社会网络分析的可操作测量
      source: Lin 2001, Social Capital【页码待核】
  entry_type: 概念
  status: 草稿
  confidence: 明确实例
  reviewer: ''
  last_reviewed: ''
