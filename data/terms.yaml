  name_zh: 紧张理论
  name_en: strain theory
  aliases: [失范理论, 结构紧张理论]
  proponent: 罗伯特·默顿
  first_year: 1938
  first_source: Social Structure and Anomie
  school: [结构功能主义]
  application: [越轨与犯罪, 社会分层与流动]
  definition: 社会结构一方面确立普遍追求的文化目标，另一方面又按阶层位置不均衡地分配实现目标的手段；两者的脱节使处于劣势位置者更可能以越轨方式应对。
  definition_source: Merton 1938, Social Structure and Anomie【页码待核】
  polysemy:
    - author: 罗伯特·阿格纽
      definition: 紧张不只来自目标与手段的结构性脱节，也来自个体在具体情境中无法回避的负面刺激与期望落差。
      differs_from: 默顿
      note: 分析层次从社会结构下移到个体经验，使紧张理论可用于解释个体间的差异
      source: Agnew 1992, Foundation for a General Strain Theory of Crime and Delinquency【页码待核】
