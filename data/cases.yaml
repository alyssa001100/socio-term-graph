  description: 学校以看似中立的标准评价学生，实际奖励的是上层阶级经由家庭教育获得的语言风格与审美品味。
  origin: 布迪厄与帕斯隆对法国高等教育系统的分析
  source: 布迪厄、帕斯隆《继承人》1964；《再生产》1970
  attributions:
