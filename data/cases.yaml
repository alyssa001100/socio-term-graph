      mismatch: 案例的机制落在学校制度这一侧，家庭内部的文化传递只在背景中出现；其经验对象是 1960 年代的法国高教系统，外推到教育扩张之后、选拔标准已改变的语境需另行论证。
      confidence: 明确实例
      dissent: ''
    - term_id: TERM-0003
