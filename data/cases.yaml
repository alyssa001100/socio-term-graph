- case_id: CASE-0001
  title: 通过熟人介绍获得工作
  description: 求职者经由社交网络中的非亲密联系人获得招聘信息并成功入职。
  origin: 格兰诺维特对美国郊区专业技术人员求职过程的调查
  source: Granovetter 1974, Getting a Job
  attributions:
    - term_id: TERM-0004
      match: 提供关键信息的既不是亲属也不是密友，而是平时不常来往的熟人，对上「交往频率低、情感强度弱、互惠内容少」这一要件所指的联系形态。
      mismatch: 案例把「弱」操作化为交往频率低，情感强度与互惠内容没有被单独观测——属于测量口径的收窄，不影响归属成立。
      confidence: 明确实例
      dissent: ''
    - term_id: TERM-0001
      match: 熟人网络在求职中被实际动用，换来信息与介绍，对上「与相互熟识的关系构成的持久网络相联系的可动员资源」这一要件。
      mismatch: 缺的是「制度化」这一要件：熟人网络是自然形成的私人关系，没有被组织化，案例也没有显示它与制度化团体（协会、社群）的联系——这正是它与科尔曼、帕特南两条线索的分界处。
      confidence: 部分符合
      dissent: 有研究认为仅凭信息渠道不足以称为社会资本
  status: 草稿
- case_id: CASE-0002
