  description: 长期失业者与社会保障体系之外的群体在政策讨论中被命名为「被排除者」，关注点从收入不足转向社会关系的断裂。
  origin: 勒努瓦对法国社会政策对象的分析
  source: Lenoir 1974, Les Exclus
  attributions:
    - term_id: TERM-0018
      match: 关注点从收入不足转向社会关系的断裂，对上「因缺乏资源、权利与参与机会而被排斥在主流社会关系与制度之外」这一要件。
      mismatch: 案例是政策语境的产物，其外延以社会保障的覆盖范围为框架；把它用于缺乏此类制度的语境，需要另行论证。
      confidence: 明确实例
      dissent: ''
  status: 草稿
- case_id: CASE-0016
  title: 全景敞视监狱
  description: 边沁设计的环形监狱让囚室处于持续可见的状态，被囚者无法确认自己此刻是否正被观看，因而自行约束行为。福柯以此说明现代社会普遍存在的规训机制。
  origin: 福柯对边沁全景敞视建筑的分析
  source: 福柯《规训与惩罚》1975
  attributions:
    - term_id: TERM-0024
      match: 被囚者无法确认自己此刻是否正被观看，因而自行约束行为，对上「通过层级监视与检查等技术把身体训练成既顺从又有用」这一要件。
      mismatch: 福柯的规训不限于监狱，学校、军营、工厂同样适用；案例给出的是这一机制最纯粹的形态，其他场域只在推论中被提及。
      confidence: 明确实例
      dissent: ''
    - term_id: TERM-0016
      match: 规训使个体在没有外部强制时仍维持秩序，对上「既有的社会结构被延续」这一要件。
      mismatch: 缺的是「代际之间」与「被赋予正当性」两项要件：案例讨论的是同一个体在同期内的行为塑造，既没有代际维度，也没有说明这种秩序为何被当作正当的。
      confidence: 部分符合
      dissent: ''
  status: 草稿
- case_id: CASE-0017
  title: 协作培养与自然成长
  description: 拉鲁比较美国中产与工人阶级家庭的育儿方式：中产家庭有组织地安排课外活动、主动与学校交涉并训练孩子表达主张；工人家庭更强调孩子自然成长与对成人的服从。同样的学校评价标准对前者更有利。
  origin: 拉鲁对美国小学家庭的追踪观察
  source: Lareau 2003, Unequal Childhoods
  attributions:
    - term_id: TERM-0013
      match: 有组织的活动安排与同制度交涉的能力由家庭长期养成，被学校识别并奖励，对上「与知识、教育、品味相关、以身体化状态存在的资源」这一要件。
      mismatch: 案例呈现的是家庭教养方式转化为学校优势的过程，文化资本被制度化认可（文凭）的那一环没有涉及；其经验材料限于美国的种族与阶级构成。
      confidence: 明确实例
      dissent: ''
    - term_id: TERM-0019
      match: 两种教养方式被当作家庭品味与教养水平的差异，对上「通过品味与生活方式的差异把自身与他者区分开来」这一要件。
      mismatch: 缺的是「使这种差异成为标示社会位置的象征标记」这一主动面：案例侧重学校一侧的评价差异，家庭之间相互区分、彼此贬低的环节呈现不足。
      confidence: 部分符合
      dissent: ''
    - term_id: TERM-0003
      match: 教养方式在日常互动中长期反复，使孩子形成对待学校与自身处境的稳定反应方式，对上「持久的倾向系统」这一要件。
      mismatch: 缺的是「可转移」与「倾向于再生产社会结构」：案例主要呈现这些倾向在学业与学校互动中的表现，未验证其向其他场域的迁移，也未追踪其长期结果。
      confidence: 部分符合
      dissent: ''
  status: 草稿
- case_id: CASE-0018
  title: 美国大城市的种族居住隔离
  description: 马西与登顿用五个维度测量美国城市的居住分异，指出黑人聚居区在均等性与暴露度上长期偏离其他族群的模式，其形成无法由收入差异单独解释。
  origin: 马西与登顿对全美城市居住数据与隔离指数的分析
  source: Massey & Denton 1993, American Apartheid
  attributions:
    - term_id: TERM-0025
      match: 案例按均等性、暴露度等维度量化群体在空间上的分离，对上「在均等性、暴露度、集中度等维度上呈现可测量的分异」这一要件。
      mismatch: 五个维度是测量工具，案例没有讨论各维度之间的因果次序（哪一维度先起作用）；它也没有单独处理收入差异所能解释的那部分分异。
      confidence: 明确实例
      dissent: ''
    - term_id: TERM-0012
      match: 制度性与市场性的排斥把某一群体限定在特定区域，对上「将外部者排斥在外」这一要件。
      mismatch: 缺的是「明确的资格限制」：案例中的排斥多由分散的市场行为与制度惯例实现，指不出公开的准入规则，也没有指出谁在维护优势。
      confidence: 部分符合
      dissent: 有研究认为购房偏好差异也构成部分解释
  status: 草稿
