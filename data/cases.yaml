      match: 语言风格与审美品味由家庭教育长期习得、随身携带，却被学校当作学生自身的能力来评价，对上「以身体化状态存在」这一要件。
      mismatch: 案例只呈现身体化状态被评价的效应，文化资本的客观化（书籍、藏品）与制度化（文凭）两态在筛选中的位置没有涉及——属于案例覆盖面的限定，不是要件缺失。
