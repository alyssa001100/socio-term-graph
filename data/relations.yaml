# 概念层·边：术语之间的概念关系
# 方向读法：from_term --type--> to_term 一律读作「from 对 to 施加该关系」
#   例：文化资本 --借用--> 经济资本 =「文化资本借用了经济资本的概念」
# 纪律：evidence 必须是可引用的原句或紧贴原文的转述
- {rel_id: REL-0001, from_term: TERM-0001, to_term: TERM-0004, type: 借用, status: 草稿,
   evidence: 林南把弱关系提供的桥接机制纳入社会资本的可动员资源框架。,
   explain: "社会资本把弱关系从「关系强度」的一种，改造成「可被动员的桥接资源」——概念被借来之后承担了新任务。",
   boundary: "这是借用而非等同：弱关系只描述联结本身的强弱，社会资本还要求这些联结能被稳定占有并兑换成别的资源。",
   source: "Lin 2001, Social Capital【页码待核】"}
- {rel_id: REL-0002, from_term: TERM-0003, to_term: TERM-0006, type: 对立, status: 草稿,
   evidence: 布迪厄以惯习说明实践的逻辑并非理性计算，明确反对以效用最大化解释行动。,
   explain: "两条解释行动的路径在同一维度上互斥：一条把行动追溯到内化的倾向系统，一条追溯到约束条件下的效用计算。",
   boundary: "对立不等于互不相关：布迪厄并不否认行动有策略性，他否认的是把策略还原为有意识的最大化计算。",
   source: 布迪厄《实践感》1980【页码待核】}
- {rel_id: REL-0003, from_term: TERM-0002, to_term: TERM-0001, type: 包含, status: 草稿,
   evidence: 场域是行动者争夺各类资本的空间，社会资本是其中一种被争夺的资本形式。,
   explain: "社会资本被安置在场域内部：它是行动者争夺的资源之一，其分量取决于该场域自身的规则。",
   boundary: "包含说的是分析位置而非时间先后——场域并不是先于社会资本出现的东西。",
   source: 布迪厄《实践感》1980【页码待核】}
- {rel_id: REL-0004, from_term: TERM-0013, to_term: TERM-0014, type: 借用, status: 草稿,
   evidence: 布迪厄借用经济学的资本概念并将其扩展至文化领域，同时改变了该概念的适用范围。,
   explain: "布迪厄把「资本」这个经济学词借进文化领域，同时改写了它的适用范围：文化资本可以积累、可以投资，却不能直接标价。",
   boundary: "借用改变了原概念：文化资本的收益无法像利润那样被直接换算成货币。",
   source: 布迪厄《资本的形式》1986【页码待核】}
- {rel_id: REL-0005, from_term: TERM-0001, to_term: TERM-0014, type: 借用, status: 草稿,
   evidence: 社会资本概念同样借自经济学资本概念，被扩展至关系网络的资源分析。,
   explain: "社会资本与符号资本是同一套借用动作的两个落点：都是把「资本」的积累性迁移到非经济领域。",
   boundary: "社会资本强调的是可动员性，经济资本的强调的是可计价性，两者不可互换。",
   source: 布迪厄《资本的形式》1986【页码待核】}
- {rel_id: REL-0006, from_term: TERM-0015, to_term: TERM-0014, type: 借用, status: 草稿,
   evidence: 符号资本借自经济资本概念，用以指称被承认为正当的资本形态。,
   explain: "符号资本借「资本」之名，强调被承认的优势同样可以被积累和继承，只是它的账本记在声望与体面里。",
   boundary: "符号资本只在被承认时才有效力：没有承认，它连账面价值都不存在。",
   source: 布迪厄《实践理论大纲》1977【页码待核】}
- {rel_id: REL-0007, from_term: TERM-0002, to_term: TERM-0013, type: 包含, status: 草稿,
   evidence: 场域是各类资本被争夺的空间，文化资本是场域中一种主要的资本形式。,
   explain: "文化资本是场域中最具区分效力的资源之一，场域分析正是围绕它对行动者的争夺展开的。",
   source: 布迪厄《区分》1984【页码待核】}
- {rel_id: REL-0008, from_term: TERM-0002, to_term: TERM-0014, type: 包含, status: 草稿,
   evidence: 场域中同时存在经济资本，不同场域中各类资本的相对权重不同。,
   explain: "经济资本同样在场域内起作用，但它的兑换效力随场域而变——这正是布迪厄反对单一经济决定论的落点。",
   boundary: "「场域包含经济资本」不等于经济资本决定一切；不同场域里各类资本的相对权重并不相同。",
   source: 布迪厄《区分》1984【页码待核】}
- {rel_id: REL-0009, from_term: TERM-0002, to_term: TERM-0015, type: 包含, status: 草稿,
   evidence: 符号资本在特定场域内被承认，其效力依赖于该场域自身的逻辑。,
   explain: "符号资本的效力完全依赖场域内部成员的承认，离开该场域，它的效力随之消失。",
   boundary: "被承认的前提是场域内共享的信念，不是普遍认同——出了这个场域，符号资本可能一文不值。",
   source: 布迪厄《实践理论大纲》1977【页码待核】}
- {rel_id: REL-0010, from_term: TERM-0014, to_term: TERM-0013, type: 转化, status: 草稿,
   evidence: 经济资本可经由教育投资转化为文化资本，但转化需要时间与投入，且并非等额兑换。,
   explain: "教育投资是经济资本转为文化资本的通道，但转化要付出时间与家庭陪伴，回报率也不确定。",
   boundary: "转化不是等额兑换，也不会自动发生：家庭能提供的闲暇与陪伴本身就是转化的条件。",
   source: 布迪厄《资本的形式》1986【页码待核】}
- {rel_id: REL-0011, from_term: TERM-0013, to_term: TERM-0001, type: 转化, status: 草稿,
   evidence: 制度化的文化资本有助于行动者进入并维系特定的关系网络。,
   explain: "制度化的文化资本（学历、头衔）是进入关系网络的门票：它让行动者被当作「值得交往的人」。",
   boundary: "这条边说的是有助于进入网络，不是保证网络中的资源可被动员——那是社会资本自身的问题。",
   source: 布迪厄《资本的形式》1986【页码待核】}
- {rel_id: REL-0012, from_term: TERM-0013, to_term: TERM-0015, type: 转化, status: 草稿,
   evidence: 文化资本被承认为正当之后即以符号资本的形式发挥作用。,
   explain: "文化资本被承认为正当之后，就以声望的形式发挥作用，无须再靠实际效用证明自己。",
   boundary: "「转化为符号资本」不是说文化资本消失了，而是说它多了一层正当性的外衣。",
   source: 布迪厄《实践理论大纲》1977【页码待核】}
- {rel_id: REL-0013, from_term: TERM-0001, to_term: TERM-0015, type: 转化, status: 草稿,
   evidence: 由关系网络带来的优势被承认为理所当然时，即表现为符号资本。,
   explain: "由关系网络带来的优势，一旦被当作理所当然，就以符号资本的形式起作用。",
   boundary: "这条边成立的前提是「被承认」；不被承认的关系优势只是私人便利，不构成符号资本。",
   source: 布迪厄《实践理论大纲》1977【页码待核】}
- {rel_id: REL-0014, from_term: TERM-0013, to_term: TERM-0016, type: 机制, status: 草稿,
   evidence: 教育系统以文化资本为中介筛选并区隔学生，从而实现阶级结构的再生产。,
   explain: "教育系统以文化资本为筛选标准，把阶级结构一代代传下去——布迪厄用这条机制说明学校并非中立的选拔场。",
   boundary: "这是机制而非意图：教师与学生都不是在合谋，结构的延续不需要任何人有意为之。",
   source: 布迪厄、帕斯隆《再生产》1970【页码待核】}
- {rel_id: REL-0015, from_term: TERM-0003, to_term: TERM-0016, type: 机制, status: 草稿,
   evidence: 惯习使被结构化的行动倾向在实践中自动延续既有结构，无需外在强制。,
   explain: "惯习让结构在行动中自动延续，既不需要强制也不需要共谋，这是布迪厄解释秩序稳定性的关键一步。",
   source: 布迪厄《实践理论大纲》1977【页码待核】}
- {rel_id: REL-0016, from_term: TERM-0012, to_term: TERM-0007, type: 机制, status: 草稿,
   evidence: 封闭通过限制资源与机会的获取资格，维持层级之间的边界与优势位置。,
   explain: "封闭是分层得以维持的机制之一：靠资格限制把层与层之间的边界固定下来，不让位置随意流动。",
   boundary: "封闭解释的是边界如何被固定，不解释层级为何存在——那是分层理论要回答的问题。",
   source: 韦伯《经济与社会》1922【页码待核】}
- {rel_id: REL-0017, from_term: TERM-0017, to_term: TERM-0012, type: 机制, status: 草稿,
   evidence: 柯林斯认为教育文凭主要作为职业准入的排他手段起作用，而非技能凭证。,
   explain: "柯林斯把文凭扩张到「排他工具」这一层：教育的膨胀并非技能需求所致，而是职业准入的排他竞争。",
   boundary: "这条边依赖一个制度条件：雇主以文凭作筛选工具。缺了这个条件，文凭膨胀不会自动变成封闭。",
