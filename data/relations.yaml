- {rel_id: REL-0018, from_term: TERM-0011, to_term: TERM-0012, type: 对立, status: 草稿,
   evidence: 两者在同一维度上互斥：封闭限制位置的变动，而流动以位置变动的可能性为定义。,
   explain: "两者在同一维度上互斥：封闭压低位置变动的可能，流动则以位置变动的可能为定义。",
   boundary: "不是非此即彼：现实社会中总同时存在一定流动与一定封闭，这条边说的是二者在逻辑上的紧张关系。",
