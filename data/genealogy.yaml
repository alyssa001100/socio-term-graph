# 谱系：同一个术语被反复重新定义的历史
#   一张谱系 = 一条血脉；一个版本 = 一次定义；一条边 = 后一版怎么改写前一版
# 约束：
#   1. 谱系边两端必须属于同一个术语 —— 跨术语的关系归 relations.yaml，不在此重复
#   2. 分叉 / 合流不写进数据 —— 一个版本有几条出边、指向哪几条谱系，由拓扑推出
#   3. 版本出处由 作者+书名+年份 唯一确定，不再单设 source 字段
lineages:
- lineage_id: LIN-01
  term_id: TERM-0001
  name: 资源与再生产线
  question: 社会资本是「谁手里有多少」，还是「一个共同体有多能合作」？
  thesis: 社会资本是资本的一种形式——它和不平等一样可积累、可转换，因此参与阶级位置的再生产。
  blind_spot: 难以解释为什么同样贫困的社区在治理绩效上差异巨大；注意力放在位置差异上，对「合作如何可能」着墨少。
  status: 草稿
- lineage_id: LIN-02
  term_id: TERM-0001
  name: 共同体线
  question: 一个共同体为什么能合作？
  thesis: 社会资本是共同体的结构特征（信任、规范、网络），它决定集体行动的成败，因此能解释治理绩效。
  blind_spot: 容易把「有社会资本」当成好事，忽略它也可以用于排斥（排外社团、黑帮）；对不平等如何被再生产不敏感。
  status: 草稿
- lineage_id: LIN-03
  term_id: TERM-0008
  name: 生产关系线
  question: 阶级是不是一个由生产中的位置决定的位置？
  thesis: 阶级由生产关系中的位置决定，核心机制是剥削；只要剩余劳动被占有，阶级关系就存在。
  blind_spot: 难以安放经理、专业技术人员这类「既占有他人劳动、又被占有」的位置；对文化、生活方式在阶级形成中的作用着墨少。
  status: 草稿
- lineage_id: LIN-04
  term_id: TERM-0008
  name: 市场与地位线
  question: 除了生产关系，还有什么把人和人分开？
  thesis: 阶级是市场机会与生活机会的分布，它和地位、政党并列，是多维分层中的一个维度。
  blind_spot: 多维化之后，阶级的边界依赖操作定义，难以说明哪一种维度在特定社会里更具决定作用。
  status: 草稿
- lineage_id: LIN-05
  term_id: TERM-0029
  name: 规范失衡线
  question: 社会为什么会「在规范这一层」出问题？
  thesis: 失范是规范对行动的约束失效——要么规范来不及随分工长出，要么目标与手段脱节。
  blind_spot: 把失范当作社会结构层面的病，难以解释为什么同一结构下只有一部分人越轨。
  status: 草稿
- lineage_id: LIN-06
  term_id: TERM-0029
  name: 紧张线
  question: 为什么处境相似的人，越轨程度并不相同？
  thesis: 紧张不只来自目标与手段的脱节，也来自个体在具体情境中无法回避的负面刺激与期望落差。
  blind_spot: 个体化之后，对「为什么某一类人系统性地承受更多紧张」的结构解释变弱。
  status: 草稿
- lineage_id: LIN-07
  term_id: TERM-0034
  name: 越轨定义线
  question: 越轨是行为本身的属性，还是被贴上去的标签？
  thesis: 越轨不是行为的固有属性，而是社会定义与反应的产物；标签会改变被标定者的自我概念，从而生成后续越轨。
  blind_spot: 难以解释「初次越轨」从何而来；对标签施加者的权力结构有描述，但缺少系统测量。
  status: 草稿
- lineage_id: LIN-08
  term_id: TERM-0062
  name: 互动框架线
  question: 人如何知道「现在正在发生什么」？
  thesis: 框架是组织经验的解释图式；它界定情境，使人能够对同一事件给出不同的理解。
  blind_spot: 停留在互动层面，难以说明媒介内容如何系统性地塑造公众理解。
  status: 草稿
- lineage_id: LIN-09
  term_id: TERM-0062
  name: 媒介框架线
  question: 媒体报道为什么能让同一件事显得完全不同？
  thesis: 框架是文本的选择与凸显：它定义问题、诊断因果、给出评价、提出对策。
  blind_spot: 偏向文本效果，对受众如何接收与抵抗着墨少。
  status: 草稿
- lineage_id: LIN-10
  term_id: TERM-0065
  name: 霸权线
  question: 支配为什么能在没有明显强制的情况下维持？
  thesis: 霸权是以同意而非强制维持的支配，通过市民社会中的文化机构生产，因此始终需要被重新赢得。
  blind_spot: 容易把支配读成单向灌输，对普通人如何协商与抵抗着墨不足。
  status: 草稿
- lineage_id: LIN-11
  term_id: TERM-0045
  name: 都市人格线
  question: 城市生活会把人的心智改造成什么样？
  thesis: 城市性是一种被空间形态逼出来的心理与互动方式——密集、异质与快速刺激塑造了都市人格。
  blind_spot: 把城市当作单一的刺激环境，对城市内部的分化与权力关系着墨少。
  status: 草稿
- lineage_id: LIN-12
  term_id: TERM-0061
  name: 记忆载体线
  question: 一群人如何记住自己没有亲身经历的事？
  thesis: 记忆依赖社会框架，而框架可以由文本、仪式与制度承载，因此记忆能够跨越世代而不依赖亲历者。
  blind_spot: 对记忆如何被权力选择性保存与抹除着墨较少。
  status: 草稿
nodes:
- node_id: GN-0001
  lineage_id: LIN-01
  author: 皮埃尔·布迪厄
  year: 1986
  work: 《资本的形式》
  claim: 实际或潜在资源的总和，这些资源与制度化关系网络相连；经济、文化、社会资本可以相互转换。
- node_id: GN-0002
  lineage_id: LIN-01
  author: 林南
  year: 2001
  work: 《社会资本》
  claim: 嵌入社会网络中、可通过目的性行动获取或动员的资源；可操作化为网络中的资源存量。
- node_id: GN-0003
  lineage_id: LIN-02
  author: 詹姆斯·科尔曼
  year: 1988
  work: 《社会资本在人力资本创造中的作用》
  claim: 社会结构资源，表现为义务与期望、信息渠道、规范与有效惩罚；它降低交易成本，便利理性行动。
- node_id: GN-0004
  lineage_id: LIN-02
  author: 罗伯特·帕特南
  year: 1993
  work: 《使民主运转起来》
  claim: 信任、规范与网络等社会组织特征，能促进合作以提高社会效率；以意大利南北治理差异为经验证据。
- node_id: GN-0005
  lineage_id: LIN-03
  author: 马克思
  year: 1867
  work: 《资本论》第一卷
  claim: 阶级由对生产资料的占有关系决定；剥削源于对剩余价值的占有，阶级关系是生产关系的表现。
- node_id: GN-0006
  lineage_id: LIN-03
  author: 埃里克·奥林·赖特
  year: 1985
  work: 《阶级》
  claim: 存在「矛盾的阶级位置」——经理与专业技术人员同时处于剥削与被剥削的位置，阶级结构不是二分而是多维的。
- node_id: GN-0007
  lineage_id: LIN-04
  author: 马克斯·韦伯
  year: 1922
  work: 《经济与社会》
  claim: 阶级是在市场上具有相同生活机会的人群；与地位群体、政党并列，构成三种分层维度之一。
- node_id: GN-0008
  lineage_id: LIN-04
  author: 皮埃尔·布迪厄
  year: 1984
  work: 《区分》
  claim: 阶级由资本总量与资本构成界定的位置，并通过生活方式与趣味表现自身；分类本身参与阶级的构成。
- node_id: GN-0009
  lineage_id: LIN-05
  author: 埃米尔·涂尔干
  year: 1893
  work: 《社会分工论》
  claim: 分工快速扩张而规范未能同步生长时，各环节之间缺乏足够的规范调节，形成失范状态。
- node_id: GN-0010
  lineage_id: LIN-05
  author: 埃米尔·涂尔干
  year: 1897
  work: 《自杀论》
  claim: 失范指社会规范对欲望的调节失效，个体欲望失去边界，表现为失范型自杀。
- node_id: GN-0011
  lineage_id: LIN-05
  author: 罗伯特·默顿
  year: 1938
  work: 《社会结构与失范》
  claim: 失范是文化目标与制度化手段之间的脱节；目标被普遍强调而手段被结构性阻断时，越轨成为可预期的适应方式。
- node_id: GN-0012
  lineage_id: LIN-06
  author: 罗伯特·阿格纽
  year: 1992
  work: 《一般紧张理论的基础》
  claim: 紧张来自三类来源——目标受阻、正面刺激的丧失、负面刺激的呈现；分析层次下移到个体经验。
- node_id: GN-0013
  lineage_id: LIN-07
  author: 弗兰克·坦南鲍姆
  year: 1938
  work: 《犯罪与社会》
  claim: 越轨的加剧来自「邪恶的戏剧化」——社会对行为的戏剧化反应把偶发行为固化为身份。
- node_id: GN-0014
  lineage_id: LIN-07
  author: 埃德温·莱默特
  year: 1951
  work: 《社会病理学》
  claim: 区分初级越轨与次级越轨；次级越轨是被标定之后、对他人反应的再反应。
- node_id: GN-0015
  lineage_id: LIN-07
  author: 霍华德·贝克尔
  year: 1963
  work: 《局外人》
  claim: 越轨由社会群体施加规则与标签而成立；标签能否成立，取决于谁有权定义规则。
- node_id: GN-0016
  lineage_id: LIN-08
  author: 格雷戈里·贝特森
  year: 1955
  work: 《游戏与幻想的理论》
  claim: 框架是界定「这段交流属于什么活动」的元沟通信号；玩耍之所以可能，是因为双方共享「这是玩」的框架。
- node_id: GN-0017
  lineage_id: LIN-08
  author: 欧文·戈夫曼
  year: 1974
  work: 《框架分析》
  claim: 框架是组织经验的解释图式；人们通过回答「这属于什么」来组织日常互动。
- node_id: GN-0018
  lineage_id: LIN-09
  author: 罗伯特·恩特曼
  year: 1993
  work: 《框架：朝向一个破碎范式的澄清》
  claim: 框架是选择并凸显现实的某些方面，使问题获得定义、因果被诊断、评价被给出、对策被提出。
- node_id: GN-0019
  lineage_id: LIN-10
  author: 安东尼奥·葛兰西
  year: 1971
  work: 《狱中札记》
  claim: 霸权是通过市民社会中的同意而维持的支配，区别于以国家强制力维持的统治。
- node_id: GN-0020
  lineage_id: LIN-10
  author: 雷蒙·威廉斯
  year: 1977
  work: 《马克思主义与文学》
  claim: 霸权是持续被协商的过程，内部并存支配性的、残余的与新兴的文化要素。
- node_id: GN-0021
  lineage_id: LIN-10
  author: 斯图亚特·霍尔
  year: 1980
  work: 《编码与解码》
  claim: 受众对编码的解读有主导、协商、对抗三种位置，意义在解码环节被重新生产的可能性由此打开。
- node_id: GN-0022
  lineage_id: LIN-11
  author: 格奥尔格·齐美尔
  year: 1903
  work: 《大都市与精神生活》
  claim: 大都市的密集刺激迫使个体以矜持与理性计算自我保存，形成都市人格。
- node_id: GN-0023
  lineage_id: LIN-11
  author: 路易斯·沃斯
  year: 1938
  work: 《作为生活方式的都市性》
  claim: 城市性是由人口规模、密度与异质性决定的独特生活方式，而非地理边界内的居住。
- node_id: GN-0024
  lineage_id: LIN-12
  author: 莫里斯·哈布瓦赫
  year: 1925
  work: 《记忆的社会框架》
  claim: 记忆依赖社会框架，个体在群体中回忆；群体本身拥有记忆。
- node_id: GN-0025
  lineage_id: LIN-12
  author: 扬·阿斯曼
  year: 1992
  work: 《文化记忆》
  claim: 记忆分为沟通记忆与文化记忆，后者经文本、仪式与制度固化并跨越世代。
- node_id: GN-0026
  lineage_id: LIN-11
  author: 赫伯特·甘斯
  year: 1962
  work: 《城市村民》
  claim: 城市性并不必然带来疏离；族群与阶层会把城市居民重新组织为有内聚力的「城市村民」式社区。
edges:
- edge_id: GE-0001
  from: GN-0001
  to: GN-0002
  type: 移植
  what_changed: 分析单位从阶级群体的资本构成下移到个体可动员的网络资源，并发展出可测量的网络指标。
  evidence: 林南把社会资本界定为嵌入社会网络中、可通过目的性行动获取或动员的资源。
  source: 林南《社会资本》2001
- edge_id: GE-0002
  from: GN-0001
  to: GN-0003
  type: 改写
  what_changed: 抽掉了「资本即不平等再生产」这一核心，把社会资本改写成中性、可被任何理性行动者调用的结构资源。
  evidence: 科尔曼把社会资本界定为社会结构资源，表现为义务与期望、信息渠道、规范与有效惩罚。
  source: Coleman 1988
- edge_id: GE-0003
  from: GN-0003
  to: GN-0004
  type: 移植
  what_changed: 分析单位从个体行动者的结构资源上移到共同体层面，社会资本成为地区治理绩效的解释变量。
  evidence: 帕特南把社会资本界定为信任、规范与网络等社会组织的特征，能促进合作以提高社会效率。
  source: Putnam 1993
- edge_id: GE-0004
  from: GN-0005
  to: GN-0006
  type: 继承
  what_changed: 保留「阶级即生产关系位置、核心机制是剥削」的骨架，把二分的阶级结构扩展为允许中间位置的类型学。
  evidence: 赖特以「矛盾的阶级位置」描述经理与专业技术人员同时占有和不占有生产资料的情形。
  source: Wright 1985, Classes
- edge_id: GE-0005
  from: GN-0005
  to: GN-0007
  type: 批判
  what_changed: 拒绝以生产关系作为唯一标准，改用市场机会，并把分层拆成阶级、地位、政党三个维度。
  evidence: 韦伯把阶级界定为在市场上具有相同生活机会的人群，并与地位群体、政党并列。
  source: 韦伯《经济与社会》1922
- edge_id: GE-0006
  from: GN-0007
  to: GN-0008
  type: 改写
  what_changed: 把「市场机会」替换为「资本总量与构成」，并引入文化维度：阶级不只是经济位置，也通过趣味与生活方式被生产和识别。
  evidence: 布迪厄以资本总量与资本构成界定阶级位置，并指出阶级通过生活方式与趣味表现自身。
  source: 布迪厄《区分》1984
- edge_id: GE-0007
  from: GN-0009
  to: GN-0010
  type: 扩张
  what_changed: 从分工层面的规范缺失，扩展到个体欲望调节层面，并把失范与自杀类型连接起来。
  evidence: 涂尔干以失范型自杀描述规范调节失效时欲望失去边界的状态。
  source: 涂尔干《自杀论》1897
- edge_id: GE-0008
  from: GN-0010
  to: GN-0011
  type: 改写
  what_changed: 把「规范缺失」替换为「目标与手段的结构性脱节」，失范从社会整合问题变成越轨的解释机制。
  evidence: 默顿把失范界定为文化目标与制度化手段之间的脱节。
  source: Merton 1938
- edge_id: GE-0009
  from: GN-0011
  to: GN-0012
  type: 扩张
  what_changed: 把紧张的来源从单一的「目标与手段脱节」扩展到负面刺激与期望落差，使理论可以解释个体间差异。
  evidence: 阿格纽把紧张扩展到个体在具体情境中无法回避的负面刺激与期望落差。
  source: Agnew 1992
- edge_id: GE-0010
  from: GN-0013
  to: GN-0014
  type: 继承
  what_changed: 在「社会反应塑造越轨」的骨架上加入初级与次级越轨的区分，使标签的作用可以分阶段描述。
  evidence: 莱默特区分初级越轨与次级越轨，把后者界定为对被标定后的再反应。
  source: Lemert 1951
- edge_id: GE-0011
  from: GN-0014
  to: GN-0015
  type: 继承
  what_changed: 把标签的成立条件明确为「规则由谁施加」，把定义权与权力关系纳入理论核心。
  evidence: 贝克尔指出越轨由社会群体施加规则与标签而成立。
  source: Becker 1963
- edge_id: GE-0012
  from: GN-0016
  to: GN-0017
  type: 移植
  what_changed: 从动物与游戏的元沟通，移到日常互动的经验组织；框架由交流信号变成一般性的解释图式。
  evidence: 戈夫曼把框架界定为组织经验的解释图式。
  source: 戈夫曼《框架分析》1974
- edge_id: GE-0013
  from: GN-0017
  to: GN-0018
  type: 移植
  what_changed: 分析对象从互动中的情境定义移到媒介文本，框架成为可编码、可比较的文本特征。
  evidence: 恩特曼把框架界定为选择并凸显现实的某些方面，使其获得定义、因果、评价与对策。
  source: Entman 1993
- edge_id: GE-0014
  from: GN-0019
  to: GN-0020
  type: 继承
  what_changed: 保留「霸权即同意」的核心，把一次性取得的支配改写成不断被挑战与修补的动态过程。
  evidence: 威廉斯把霸权描述为内部并存支配性、残余与新兴要素的持续过程。
  source: Williams 1977
- edge_id: GE-0015
  from: GN-0020
  to: GN-0021
