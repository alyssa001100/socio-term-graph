# 实例层·社会热点：时效条目，到期复审
# 纪律：描述讨论对象，不用热点自身的流行语作归类依据；来源须可核验
- hot_id: HOT-0001
  title: 县城婆罗门
  description: 网络讨论中出现的说法，指县域内长期掌握关键资源与人脉关系的少数家族。
  date: 2024-06
  source_url: https://example.com/REPLACE-需填入可核验的公开报道
  review_after: 2026-06
  analysis: "这个说法把「县城里谁说了算」的印象压缩成一个比喻。拆开看，它至少包含三件事：资源被少数家族长期掌握（社会资本）、外部者难以进入（社会封闭）、优势在家族内部传递（再生产）。三件事的符合程度并不一致——「进不去」是可观察的，因此最接近封闭；社会资本与再生产都要求证据，前者要看到资源被实际动员并兑换成别的资本，后者要看到代际延续的数据，而网络讨论提供的是印象。所以这条热点挂三处「部分符合」，没有一处标为「明确实例」。"
  attributions:
    - term_id: TERM-0001
      match: "讨论的焦点是「可动员的关系资源」：家族的优势被描述为关键时刻能说上话、办成事，而不是账面上的财富。"
      mismatch: 布迪厄意义上的社会资本须能转化为其他资本形式并具备制度化基础，网络讨论未提供可核验证据。
      confidence: 部分符合
      dissent: 有观点认为这是阶层结构的描述，而非社会资本的具体形态
    - term_id: TERM-0012
      match: "外部者被挡在外面这一点：讨论反复出现本地人难以进入某些圈子、某些位置暗中预留的说法，符合封闭概念中资格排他与维护优势的特征。"
      mismatch: 韦伯的封闭以明确的资格限制为手段（身份、职业准入等），该说法中的排斥手段未被具体说明。
      confidence: 部分符合
      dissent: ''
    - term_id: TERM-0016
      match: "代际维度：这个说法本身预设父辈的位置会传给子辈，讨论中「谁家的孩子」正是按父辈位置来辨认的。"
      mismatch: 再生产要求可观察的代际延续证据，网络讨论多为印象式描述，缺少代际数据的支撑。
      confidence: 部分符合
      dissent: ''
  status: 草稿
- hot_id: HOT-0002
  title: 学历贬值与考研热
  description: 公共讨论中关于同等岗位所需学历门槛持续上升、研究生报考规模扩大的持续争论。
  date: 2022-12
  source_url: https://example.com/REPLACE-需填入教育部报名人数公告等可核验来源
  review_after: 2027-06
  analysis: "这场讨论把两件事捆在一起：同等岗位的学历门槛上涨（需求端）与报考规模扩大（供给端）。用来检验概念时必须分层看：门槛上涨对应文凭通胀与封闭，报名扩大更接近个体的资源投资行为，可以关联文化资本但不构成对它的例证。最容易被忽略的是雇主那一侧——柯林斯的论证要求雇主以文凭作筛选工具，而公共讨论通常只讲求职者变多，把供需两方的问题混成了一件事。"
  attributions:
    - term_id: TERM-0017
      match: "门槛上移这一事实层面：同一个岗位过去招本科、现在招研究生，正是文凭通胀要解释的现象。"
      mismatch: 柯林斯的论证建立在雇主以文凭作为筛选工具的制度条件上，公共讨论多归因于求职人数增加，未涉及雇主一侧的筛选逻辑。
      confidence: 部分符合
      dissent: ''
    - term_id: TERM-0013
      match: "教育经历被当作可投入并期待回报的资源来讨论，与「文化资本可投资」的这一面一致。"
      mismatch: 文化资本强调身体化与制度化状态的长期积累及家庭传承，讨论多只聚焦学历凭证本身。
      confidence: 部分符合
      dissent: ''
    - term_id: TERM-0011
      match: "讨论的焦虑落在位置的上升上：学历还能不能换到更好的位置，正是流动概念关心的问题。"
      mismatch: 社会流动指分层结构中位置的实际变化，须由代际或代内位置数据支撑，讨论多为预期与感受。
      confidence: 有争议
      dissent: 有研究认为学历收益的下降主要体现在回报率而非流动性上
  status: 草稿
- hot_id: HOT-0003
  title: 阶层固化讨论
  description: 公共讨论中关于代际位置变动是否变难的持续争论。
  date: 2023-06
  source_url: https://example.com/REPLACE-需填入基于代际流动数据的可核验研究或报道
  review_after: 2027-06
  analysis: "这是一个以数据为争论焦点的公共议题，恰好适合检验「感受」与「测量」之间的落差。固化若成立，必须在代际流动率上看到变化；而公共讨论通常以个案与主观感受作为依据。挂载概念时还要注意方向不能互换：流动是状态，封闭是机制，再生产是解释——三者回答的是不同的问题，混用会让整条论证失去着力点。"
  attributions:
