      match: "讨论对象确实是「代际位置变动是否变难」，与社会流动的定义指向一致。"
      mismatch: 流动性下降须由代际流动率数据支撑，公共讨论多依据个案与主观感受。
      confidence: 部分符合
      dissent: ''
    - term_id: TERM-0012
      match: "优势群体对机会的排他性占有：固化论述中反复出现「入口被把住」的描述，指向封闭的核心特征。"
      mismatch: 未指出具体的资格限制机制，封闭概念所需的手段要件缺失。
      confidence: 部分符合
      dissent: ''
    - term_id: TERM-0016
      match: "优势位置的代际延续：这类论述预设父辈的资源会为子辈保留位置，属于再生产所关心的范围。"
      mismatch: 再生产强调以文化资本为中介、并将不平等正当化的机制，讨论多停留在资源传递层面，未涉及正当化过程。
      confidence: 部分符合
