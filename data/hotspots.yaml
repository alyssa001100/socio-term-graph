- hot_id: HOT-0004
  title: 第一学历歧视
  description: 公共讨论中关于用人单位以本科就读院校作为筛选条件的争论。
  date: 2024-03
  source_url: https://example.com/REPLACE-需填入可核验的招聘要求实例或报道
  review_after: 2027-03
  analysis: "这是四条热点里最接近可核验机制的一条：招聘条件是可查的，准入限制是可指的。用它检验概念时要分清两件事——门槛整体上移（文凭通胀）与同一学历内部的再区分（第一学历）。它还暴露了封闭概念的一个边界问题：韦伯的封闭讲的是群体自身的垄断策略，而第一学历歧视的排除来自雇主与制度安排，行动主体并不相同。所以这条虽然是全库确信度最高的一处归属，仍留下了一条「不符之处」。"
  attributions:
    - term_id: TERM-0012
      match: "把本科出身直接当成准入资格：招聘条件中明示或暗示的院校要求，正是封闭概念所说的资格限制手段。"
      mismatch: 韦伯的封闭多指群体自身的垄断策略，此处的限制来自雇主与制度安排，行动主体不同。
      confidence: 明确实例
      dissent: ''
    - term_id: TERM-0017
      match: "学历门槛整体上移为这种再区分提供了条件——没有普遍的门槛抬高，出身不会被单独拿出来区分。"
      mismatch: 文凭通胀描述的是门槛整体上移，第一学历歧视是同一学历内部的再区分，作用机制不同。
      confidence: 部分符合
      dissent: ''
    - term_id: TERM-0013
      match: "本科就读经历属于制度化的文化资本：它以凭证形式存在，可被雇主直接识别。"
      mismatch: 文化资本的核心在身体化与客观化状态的长期积累，第一学历歧视只涉及制度化状态的凭证。
      confidence: 部分符合
      dissent: ''
  status: 草稿
