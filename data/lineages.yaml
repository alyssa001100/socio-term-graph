  question: 秩序为谁服务，谁承担了整合的代价？
  thesis: 社会由不同群体的利益对立构成，秩序是支配群体维持优势的结果。
  blind_spot: 容易把一切制度都读成支配工具，对共识与整合的解释力弱。
