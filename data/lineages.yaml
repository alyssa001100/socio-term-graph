  - 新马克思主义
  - 冲突论
  question: 现代社会的分裂由什么决定？
  thesis: 生产关系决定阶级位置，剩余劳动的占有构成剥削，冲突内在于生产方式。
  blind_spot: 对文化、性别与消费的自主性估计不足，阶级以外的不平等常被放到从属位置。
  stage: P1
  branch: 古典三大家
  tier: core
  figures:
  - 马克思
