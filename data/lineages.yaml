  question: 什么维持了社会系统的稳定？
  thesis: 社会是各部分相互调适的系统，制度因满足功能需求而存续。
  blind_spot: 倾向把冲突读成失调、把现状读成必要，难解释变迁由谁推动。
  stage: P2
  branch: 整合与中层
