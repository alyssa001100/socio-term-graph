# 大谱系：学科史骨架。阶段（periods）是背景带，谱系（lineages）是横跨阶段的传统，
# 归属（placements）把术语挂到谱系上，并说明「它在这条谱系里回答什么问题」。
# 这里只回答术语的学科位置，不再记录同一术语的历代定义链。
# v9：大框架压缩为古典 → 现代 → 当代；stage 决定界面归组，branch 决定阶段内分支，
# tier 区分主脉与扩展传统，figures 记录代表人物（不代表已有独立术语）。

periods:
- period_id: P1
  name: 古典
  span: 1830–1935
  question: 现代性带来了什么问题，社会学如何回应？
  note: 1838 年孔德提出「社会学」，但学科真正的奠基在马克思、涂尔干与韦伯：资本主义、社会团结与理性化构成三条不同的问题路线。古典不是一套统一纲领，而是三种诊断现代性的方式。
- period_id: P2
  name: 现代
  span: 1935–1980
  question: 社会如何被整合，行动又如何被解释？
  note: 1937 年帕森斯《社会行动的结构》完成第一次大综合，默顿以中层理论把宏大框架拉回经验研究；符号互动论、交换理论与冲突理论则从微观互动、交换与权力分化挑战整合视角。
- period_id: P3
  name: 当代
  span: 1980–
  question: 分化之后，社会学如何综合，又如何面对全球与后现代？
  note: 1980s 以后不再有一条统一主线：布迪厄、吉登斯、哈贝马斯推进综合；福柯、布希亚、利奥塔转向后结构/后现代；沃勒斯坦与南方理论把欧洲中心问题化；网络社会、风险社会与行动者网络理论则回应技术与全球化的新现实。
lineages:
- lineage_id: L01
  name: 涂尔干：社会事实与实证主义
  from: 1830
  to: 1930
  periods:
  - P1
  schools:
  - 古典社会学
  question: 社会能否像自然一样被研究？
  thesis: 社会事实外在于个体、对个体有约束力，只能用其他社会事实来解释。
  blind_spot: 把社会读成可测量的事实集合，对意义、冲突与历史断裂着墨少。
  stage: P1
  branch: 古典三大家
  tier: core
  figures:
  - 涂尔干
- lineage_id: L02
  name: 历史主义与共同体
  from: 1880
  to: 1935
  periods:
  - P1
  schools:
  - 古典社会学
  question: 现代性取代了什么，又失去了什么？
  thesis: 共同体与社会是两种意志形式，现代化是一场不可逆的关系重组。
  blind_spot: 二元对立容易把前现代理想化，也难解释两者的长期共存。
  stage: P1
  branch: 历史主义
  tier: extended
  figures:
  - 滕尼斯
- lineage_id: L03
