  question: 行动的意义如何被理解？
  thesis: 社会行动由行动者赋予的意义构成，理解意义才能解释社会。
  blind_spot: 意义解释难以处理结构性约束，也难以做大规模比较。
  stage: P1
  branch: 古典三大家
  tier: core
