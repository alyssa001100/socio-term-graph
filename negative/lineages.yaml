# 负例夹具：大谱系三张子表。除 expected.yaml 登记的错误外，这份数据应当通过校验。
# 因此每个合法术语都至少有一条有效归属，每条非空谱系都有术语，每个时期都有谱系。
periods:
- period_id: P1
  name: 负例时期一
  span: 1850–1900
  question: 负例时期要问什么？
  note: 这是负例时期一的背景说明，长度必须超过二十字，否则会多出预期外的报错。
- period_id: P2
  name: 负例时期二
  span: 1900–1950
  question: 负例时期二又要问什么？
  note: 这是负例时期二的背景说明，长度同样必须超过二十字，避免覆盖规则误伤。
- period_id: P3
  name: 负例时期三
  span: 1950–2000
  question: 负例时期三继续问什么？
  note: 这是负例时期三的背景说明，用来支撑一条没有任何术语的空谱系。

lineages:
- lineage_id: LIN-9101
  name: 负例谱系甲
  from: 1850
  to: 1950
  periods: [P1, P2]
  schools: [古典社会学]
  question: 负例谱系甲要回答什么问题？
  thesis: 这是一条合法的负例谱系，用来承载重复与过短的归属问题。
  blind_spot: 它的盲点是故意留得足够长，避免触发长度下限而产生误报。
- lineage_id: LIN-9102
  name: 负例谱系乙
  from: 1850
  to: 1860
  periods: [P1, P99]
  schools: [古典社会学]
  question: 负例谱系乙要回答什么问题？
  thesis: 这条谱系的时期列表引用了不存在的时期，应当被校验器精确拦下。
  blind_spot: 它的其它字段都合法，这样报错只会来自时期引用这一处。
- lineage_id: LIN-9103
  name: 负例谱系丙
  from: 2000
  to: 1900
  periods: [P2]
  schools: [文化社会学]
  question: 负例谱系丙要回答什么问题？
  thesis: 这条谱系的起止年份被故意倒置，用来验证时间方向的结构约束。
  blind_spot: 它的其它字段都合法，避免同时产生多个非预期报错。
- lineage_id: LIN-9104
  name: 负例空谱系
  from: 1950
  to: 2000
  periods: [P3]
  schools: [文化社会学]
  question: 负例空谱系要回答什么问题？
  thesis: 这条谱系故意不挂任何术语，用来验证「谱系不得为空」的覆盖规则。
  blind_spot: 它仍被一个时期引用，因此时期覆盖检查不会额外报错。
- lineage_id: LIN-9105
  name: 负例时期缺失
  from: 1850
  to: 1950
  periods: [P1]
  schools: [古典社会学]
  question: 负例时期缺失要回答什么问题？
  thesis: 这条谱系跨到了一九五〇年，却只登记了第一个时期，应当被拦下。
  blind_spot: 它的其它字段都合法，这样报错只会来自时期覆盖这一处。

