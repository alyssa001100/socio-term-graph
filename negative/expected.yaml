# 负例集的期望命中清单
# selftest.py 读这个文件，逐条要求在 negative/ 的校验结果里找到对应报错
#   level    —— 错误 / 警告
#   file     —— 报错所属文件
#   where    —— 报错定位，必须完全相等
#   contains —— 报错信息里必须出现的片段
# 未被清单认领的报错一律计为「误报」

- {id: N01, file: terms.yaml, where: "TERM-9003.definition_source", level: 错误, contains: 必填字段缺失或为空, desc: 术语缺必填字段}
