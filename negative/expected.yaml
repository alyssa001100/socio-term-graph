# v7 新增概念群：同样的跨群规则换一对群再验一次（规则若写死成原本三个群，这里会漏检）
- {id: N54, file: relations.yaml, where: "城市、空间与社区 ↔ 知识、文化与意义", level: 警告, contains: 超过每对概念群上限, desc: 新概念群之间的桥接超过上限}
